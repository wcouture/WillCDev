services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql_root_password
      MYSQL_DATABASE: willcdev
      MYSQL_USER: willcdev_user
      MYSQL_PASSWORD: willcdev_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - willcdev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: .Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - mysql
    networks:
      - willcdev-network

volumes:
  mysql_data:

networks:
  willcdev-network:
    driver: bridge
